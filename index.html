  <main class="main-content">

    <!-- LOADING SCREEN -->
    <div class="screen" id="screen-loading">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <span>Loading record…</span>
      </div>
    </div>

    <!-- RECORD SCREEN -->
    <div class="screen" id="screen-record">

      <!-- Print-only unit info bar — hidden on-screen, populated by renderHeader() -->
      <div class="print-unit-bar" id="print-unit-bar">
        <div class="pub-field"><span class="pub-label">Property Address</span><span class="pub-value" id="pub-address"></span></div>
        <div class="pub-field"><span class="pub-label">Unit / Suite</span><span class="pub-value" id="pub-unit"></span></div>
        <div class="pub-field"><span class="pub-label">Walkthrough Date</span><span class="pub-value" id="pub-walkthrough"></span></div>
        <div class="pub-field"><span class="pub-label">Unit Type</span><span class="pub-value" id="pub-unit-type"></span></div>
        <div class="pub-field"><span class="pub-label">Quote Requested From</span><span class="pub-value" id="pub-quote-from"></span></div>
        <div class="pub-field"><span class="pub-label">Deadline</span><span class="pub-value" id="pub-deadline"></span></div>
        <div class="pub-field"><span class="pub-label">Record ID</span><span class="pub-value" id="pub-record-id"></span></div>
      </div>

      <!-- Editable property fields — auto-saving -->
      <div class="property-card">
        <div class="form-group">
          <label for="field-address">Property Address</label>
          <input type="text" id="field-address" placeholder="e.g. 100 Main St, Toronto, ON" autocomplete="off">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="field-unit">Unit / Suite</label>
            <input type="text" id="field-unit" placeholder="e.g. 412" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="field-unit-type">Unit Type</label>
            <select id="field-unit-type">
              <option value="">— Select —</option>
              <option value="1BR">1BR</option>
              <option value="2BR">2BR</option>
              <option value="3BR">3BR</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="field-walkthrough-date">Walkthrough Date</label>
            <input type="date" id="field-walkthrough-date">
          </div>
          <div class="form-group">
            <label for="field-deadline">Deadline</label>
            <input type="date" id="field-deadline">
          </div>
        </div>
      </div>

      <!-- Record meta bar -->
      <div class="record-header" id="record-header">
        <div class="record-id-label" id="record-id-label"></div>
        <div class="record-actions">
          <button class="btn btn-secondary btn-sm" onclick="copyRecordLink()">Copy Link</button>
          <button class="btn btn-ghost btn-sm" onclick="window.print()">Print</button>
        </div>
      </div>

      <!-- Progress bar -->
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="progress-label">Items marked: 0 / 0</span>
          <span id="progress-pct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>

      <!-- Spec sections (accordion) -->
      <div id="sections-container"></div>

      <!-- Contractor notes section -->
      <div id="notes-container"></div>

      <!-- Sticky send button -->
      <div class="send-area" id="send-area"></div>

    </div>
    <!-- /screen-record -->

  </main>

<div id="toast" role="alert" aria-live="assertive"></div>

<script src="assets/app.js?v=20260819"></script>
<script>
  function copyRecordLink() {
    navigator.clipboard.writeText(location.href).then(() => {
      toast('Link copied!', 'ok');
    }).catch(() => {
      toast('Copy failed — copy the URL from your address bar.', 'error');
    });
  }
</script>
