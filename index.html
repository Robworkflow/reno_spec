<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daniko Reno Spec Sheet</title>
  <meta name="description" content="Daniko Management — interactive unit renovation spec sheet for contractors.">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="stylesheet" href="assets/styles.css?v=20260816">
</head>
<body>

<div id="app">

  <!-- HEADER (shown on record screen) -->
  <header class="app-header" id="app-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-dot"></span>
        <div>
          <div class="logo-text">Daniko</div>
          <div class="logo-sub">Unit Reno Spec Sheet</div>
        </div>
      </div>
      <div class="header-status">
        <span class="status-pill draft" id="status-pill">DRAFT</span>
        <span class="autosave-indicator" id="autosave-indicator"></span>
      </div>
    </div>
  </header>

  <main class="main-content">

    <!-- LOADING SCREEN -->
    <div class="screen" id="screen-loading">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <span>Loading record…</span>
      </div>
    </div>

    <!-- RECORD SCREEN -->
    <div class="screen" id="screen-record">

      <!-- Editable property fields — auto-saving -->
      <div class="property-card">
        <div class="form-group">
          <label for="field-address">Property Address</label>
          <input type="text" id="field-address" placeholder="e.g. 100 Main St, Toronto, ON" autocomplete="off">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="field-unit">Unit / Suite</label>
            <input type="text" id="field-unit" placeholder="e.g. 412" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="field-unit-type">Unit Type</label>
            <select id="field-unit-type">
              <option value="">— Select —</option>
              <option value="1BR">1BR</option>
              <option value="2BR">2BR</option>
              <option value="3BR">3BR</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="field-walkthrough-date">Walkthrough Date</label>
            <input type="date" id="field-walkthrough-date">
          </div>
          <div class="form-group">
            <label for="field-deadline">Deadline</label>
            <input type="date" id="field-deadline">
          </div>
        </div>
      </div>

      <!-- Record meta bar -->
      <div class="record-header" id="record-header">
        <div class="record-id-label" id="record-id-label"></div>
        <div class="record-actions">
          <button class="btn btn-secondary btn-sm" onclick="copyRecordLink()">Copy Link</button>
          <button class="btn btn-ghost btn-sm" onclick="window.print()">Print</button>
        </div>
      </div>

      <!-- Progress bar -->
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="progress-label">Items marked: 0 / 0</span>
          <span id="progress-pct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>

      <!-- Spec sections (accordion) -->
      <div id="sections-container"></div>

      <!-- Contractor notes section -->
      <div id="notes-container"></div>

      <!-- Sticky send button -->
      <div class="send-area" id="send-area"></div>

    </div>
    <!-- /screen-record -->

  </main>

  <footer class="app-footer">
    Daniko Management Ltd. &copy; 2025 &mdash; Confidential
  </footer>

</div><!-- /app -->

<!-- Toast notification -->
<div id="toast" role="alert" aria-live="assertive"></div>

<script src="assets/config.js?v=20260816"></script>
<script src="assets/app.js?v=20260816"></script>
<script>
  function copyRecordLink() {
    navigator.clipboard.writeText(location.href).then(() => {
      toast('Link copied!', 'ok');
    }).catch(() => {
      toast('Copy failed — copy the URL from your address bar.', 'error');
    });
  }
</script>

</body>
</html>
