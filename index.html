<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daniko Reno Spec Sheet</title>
  <meta name="description" content="Daniko Management — interactive unit renovation spec sheet for contractors.">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="stylesheet" href="assets/styles.css?v=08768c2">
</head>
<body>

<div id="app">

  <!-- HEADER (shown on record screen) -->
  <header class="app-header" id="app-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-dot"></span>
        <div>
          <div class="logo-text">Daniko</div>
          <div class="logo-sub">Unit Reno Spec Sheet</div>
        </div>
      </div>
      <div class="header-status">
        <span class="status-pill draft" id="status-pill">DRAFT</span>
        <span class="autosave-indicator" id="autosave-indicator"></span>
      </div>
    </div>
  </header>

  <main class="main-content">

    <!-- LOADING SCREEN -->
    <div class="screen" id="screen-loading">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <span>Loading record…</span>
      </div>
    </div>

    <!-- INTAKE SCREEN -->
    <div class="screen" id="screen-intake">
      <div class="intake-card">
        <h2>New Reno Spec Sheet</h2>
        <p class="subtitle">Enter the property details to create a new spec sheet record.</p>
        <form id="intake-form" autocomplete="off">
          <div class="form-group">
            <label for="address">Property Address <span style="color:var(--danger)">*</span></label>
            <input type="text" id="address" name="address" placeholder="e.g. 100 Main St, Toronto, ON" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="unit">Unit / Suite</label>
              <input type="text" id="unit" name="unit" placeholder="e.g. 412">
            </div>
            <div class="form-group">
              <label for="walkthrough_date">Walkthrough Date</label>
              <input type="date" id="walkthrough_date" name="walkthrough_date">
            </div>
          </div>
          <div class="form-group">
            <label for="unit_type">Unit Type</label>
            <select id="unit_type" name="unit_type">
              <option value="">— Select —</option>
              <option value="1BR">1BR</option>
              <option value="2BR">2BR</option>
              <option value="3BR">3BR</option>
            </select>
          </div>
          <div class="form-group">
            <label for="quote_from">Quote Requested From <span style="color:var(--danger)">*</span></label>
            <input type="text" id="quote_from" name="quote_from" placeholder="Contractor name and/or email" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="budget_target">Budget Target</label>
              <input type="text" id="budget_target" name="budget_target" placeholder="e.g. $25,000">
            </div>
            <div class="form-group">
              <label for="deadline">Deadline</label>
              <input type="date" id="deadline" name="deadline">
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Create Spec Sheet →</button>
        </form>
      </div>
    </div>

    <!-- RECORD SCREEN -->
    <div class="screen" id="screen-record">

      <!-- Record header with address + status -->
      <div class="record-header" id="record-header">
        <div class="record-address"></div>
        <div class="record-meta"></div>
        <div class="record-actions">
          <button class="btn btn-secondary btn-sm" onclick="copyRecordLink()">Copy Link</button>
          <button class="btn btn-ghost btn-sm" onclick="window.print()">Print</button>
        </div>
      </div>

      <!-- Progress bar -->
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="progress-label">Items marked: 0 / 0</span>
          <span id="progress-pct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>

      <!-- Spec sections (accordion) -->
      <div id="sections-container"></div>

      <!-- Contractor notes section -->
      <div id="notes-container"></div>

      <!-- Sticky send button -->
      <div class="send-area" id="send-area"></div>

    </div>
    <!-- /screen-record -->

  </main>

  <footer class="app-footer">
    Daniko Management Ltd. &copy; 2025 &mdash; Confidential
  </footer>

</div><!-- /app -->

<!-- Toast notification -->
<div id="toast" role="alert" aria-live="assertive"></div>

<script src="assets/config.js?v=08768c2"></script>
<script src="assets/app.js?v=08768c2"></script>
<script>
  function copyRecordLink() {
    navigator.clipboard.writeText(location.href).then(() => {
      toast('Link copied!', 'ok');
    }).catch(() => {
      toast('Copy failed — copy the URL from your address bar.', 'error');
    });
  }
</script>

</body>
</html>
